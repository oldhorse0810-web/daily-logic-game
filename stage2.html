<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>【第二關】雙重否定地獄</title>
    <style>
        body { font-family: sans-serif; background-color: #0d0d11; color: #e4e4e7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #161622; padding: 30px; border-radius: 16px; max-width: 540px; width: 100%; text-align: center; border: 1px solid #3f222a; }
        .timer-zone { font-size: 20px; font-weight: bold; color: #f43f5e; margin: 15px 0; background: #222235; padding: 10px; border-radius: 8px; }
        .timer-num::after { content: "100"; animation: cssFineTimer 100s linear forwards; color: #facc15; }
        .game-title { font-size: 17px; font-weight: bold; color: #f43f5e; margin-bottom: 15px; background: #2a151b; padding: 10px; border-radius: 6px; border-left: 4px solid #f43f5e; }
        .box { background: #0f0f12; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #ef4444; text-align: left; }
        .btn-link { background-color: #dc2626; color: white; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; display: inline-block; text-decoration: none; margin: 8px; }
        .btn-link:hover { background-color: #b91c1c; }
        .btn-start { background-color: #10b981; font-size: 18px; width: 100%; padding: 14px; display: block; border-radius: 8px; color: white; font-weight: bold; text-decoration: none; margin-top: 15px; box-sizing: border-box; }
        @keyframes cssFineTimer {
            0% { content: "100"; } 1% { content: "99"; } 2% { content: "98"; } 3% { content: "97"; } 4% { content: "96"; } 5% { content: "95"; } 10% { content: "90"; } 20% { content: "80"; } 30% { content: "70"; } 40% { content: "60"; } 50% { content: "50"; } 60% { content: "40"; } 70% { content: "30"; } 80% { content: "20"; } 90% { content: "10"; } 100% { content: "0"; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ⏱️ 第二關全新獨立計時器，一進來徹底擺脫第一關，100% 滿分 100 重新單獨倒數 -->
    <div class="timer-zone">⏱️ 第二關當前剩餘分值：<span class="timer-num"></span> 分</div>
    
    <!-- 📊 同時在上方直接揭曉並告知上一關的分數（因為是分開的檔案，所以這行數字絕不丟失卡住！） -->
    <div style="background:#1b2e24; color:#4ade80; padding:8px; border-radius:6px; font-size:14px; margin-bottom:15px; font-weight:bold; border:1px solid #4ade80;">
        🥇 前關戰報 ➜ 恭喜！第一關「凱撒密碼」已成功解鎖破譯！
    </div>

    <div class="game-title">【第二關：雙重否定指令地獄】</div>
    <div class="box">
        <h3 style="font-size: 20px; color: #facc15; margin-top: 5px; text-align: center;">「請不要不點擊『非右邊』的相反」</h3>
        <p style="color: #6b7280; font-size: 13px; text-align: center;">（提示拆解：非右邊 = 左，左的相反 = 右，不要不點 = 要點 ➔ 答案：右）</p>
    </div>
