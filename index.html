<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 硬核級！每日 AI 推理舒壓遊戲盒</title>
    <style>
        body {
            font-family: sans-serif, "Microsoft JhengHei";
            background-color: #0f0f12;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1a1a22;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid #2e2e3e;
        }
        h1 { color: #f43f5e; margin-top: 0; font-size: 24px; letter-spacing: 1px; }
        .score-board {
            display: flex;
            justify-content: space-around;
            background: #252538;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #3b3b4f;
        }
        .score-val { color: #facc15; }
        .game-title {
            font-size: 17px;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 15px;
            background: #2d1c24;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #f43f5e;
        }
        .game-box {
            background: #141416;
            padding: 20px;
            border-radius: 12px;
            min-height: 18px;
            margin-bottom: 20px;
            border: 1px dashed #4b5563;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: 0.1s;
        }
        .btn:hover { background-color: #2563eb; transform: translateY(-1px); }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-share { background-color: #8b5cf6; width: 100%; margin-top: 15px; }
        .btn-share:hover { background-color: #7c3aed; }
        
        .num-input {
            padding: 12px; font-size: 16px; width: 120px; border-radius: 6px;
            border: 1px solid #4b5563; background: #27273a; color: white; text-align: center;
            letter-spacing: 2px; font-weight: bold;
        }
        .log-box {
            max-height: 120px; overflow-y: auto; text-align: left; 
            background: #1c1c24; padding: 10px; border-radius: 6px; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ 硬核級！每日 AI 推理舒壓遊戲盒</h1>
    
    <div class="score-board">
        <div>我的目前總積分: <span id="displayScore" class="score-val">0</span> 分</div>
    </div>

    <!-- 🎮 週一、週二：極限腦力心算 -->
    <div id="gameMonTue" style="display:none;">
        <div class="game-title">📅 週一、二限定：【5秒極限色盲心算】</div>
        <p>在倒數結束前，點擊正確的數學答案！</p>
        <div class="game-box">
            <h2 style="color: #60a5fa; font-size: 28px; margin: 10px 0;">23 + 48 = ?</h2>
            <button class="btn" onclick="addHardScore(10, '🎉 心算正確！')">71</button>
            <button class="btn" onclick="addHardScore(-10, '❌ 粗心算錯囉！')">69</button>
            <button class="btn" onclick="addHardScore(-10, '❌ 差一點點！')">81</button>
        </div>
    </div>

    <!-- 🎮 週三、週四：反向指令地獄 -->
    <div id="gameWedThu" style="display:none;">
        <div class="game-title">📅 週三、四限定：【反向指令神經地獄】</div>
        <p style="color: #f87171; font-weight: bold;">🚨 當前魔王命令：【故意唱反調！請點相反方向】</p>
        <div class="game-box">
            <h3 style="font-size: 20px;">請指示：【往左】</h3>
            <button class="btn btn-danger" onclick="addHardScore(-15, '❌ 慘了！你聽從了指令，應該要唱反調才對！')">⬅️ 點我往左</button>
            <button class="btn btn-danger" onclick="addHardScore(15, '🎉 反骨成功！大腦神經反應正確！')">➡️ 點我往右</button>
        </div>
    </div>

    <!-- 🎮 週五、週六、週日：100% 靜態相容 0A0B 猜數字 -->
    <div id="gameWeekend" style="display:none;">
        <div class="game-title">📅 週末限定：【硬核邏輯 0A0B 猜數字】</div>
        <p>神祕密碼是 4 個「不重複的數字」。請輸入 4 位數：</p>
        <div class="game-box">
            <input type="text" id="guessInput" class="num-input" maxlength="4" placeholder="例如4321">
            <button class="btn" style="background:#10b981;" onclick="check0A0B()">指認密碼</button>
            <h4 style="margin: 15px 0 5px 0; text-align: left; color:#a4b0be;">🕵️ 推理歷史紀錄：</h4>
            <div class="log-box" id="logBox">
                （尚未輸入任何猜測...）
            </div>
        </div>
    </div>

    <div id="resultText" style="margin-top:15px; padding:12px; border-radius:6px; font-weight:bold; background:#252538; display:none;"></div>

    <button class="btn btn-share" onclick="shareToFriend()">✉️ 複製高分連結，發給朋友發起戰帖！</button>
</div>

<script>
// 1. 安全分數接收器
var urlParams = new URLSearchParams(window.location.search);
var currentScore = parseInt(urlParams.get('score')) || 0;
document.getElementById("displayScore").innerText = currentScore;

// 2. 週末硬核 0A0B 答案固定為：4321
var secretCode = "4321";

// 自動判定星期幾切換區塊
var currentDay = new Date().getDay(); // 0是週日

if (currentDay === 1 || currentDay === 2) {
    document.getElementById("gameMonTue").style.display = "block";
} else if (currentDay === 3 || currentDay === 4) {
    document.getElementById("gameWedThu").style.display = "block";
} else {
    document.getElementById("gameWeekend").style.display = "block";
}

// 通用加分機制
function addHardScore(points, msg) {
    currentScore += points;
    if(currentScore < 0) currentScore = 0;
    document.getElementById("displayScore").innerText = currentScore;
    
    var r = document.getElementById("resultText");
    r.style.display = "block";
    r.innerText = msg;
    r.style.color = points > 0 ? "#4ade80" : "#f87171";
}

// 週末硬核 0A0B 邏輯運算（純數組比對，完全不涉及高風險 DOM 語法）
function check0A0B() {
    var input = document.getElementById("guessInput").value.trim();
    var r = document.getElementById("resultText");
    
    if (input.length !== 4 || isNaN(input)) {
        alert("請精確輸入 4 個純數字！");
        return;
    }
    
    var a = 0;
    var b = 0;
    
    // 比對 0A0B
    for (var i = 0; i < 4; i++) {
        if (input.charAt(i) === secretCode.charAt(i)) {
            a++;
        } else if (secretCode.indexOf(input.charAt(i)) !== -1) {
            b++;
        }
    }
    
    var logBox = document.getElementById("logBox");
    if(logBox.innerText.indexOf("尚未輸入") !== -1) {
        logBox.innerHTML = "";
    }
    
    // 輸出到歷史紀錄
    logBox.innerHTML += "<div>🤔 輸入 <strong>" + input + "</strong> ➜ 獲得 <strong>" + a + "A " + b + "B</strong></div>";
    
    if (a === 4) {
        currentScore += 50; // 硬核解出直接送 50 分！
        document.getElementById("displayScore").innerText = currentScore;
        r.style.display = "block";
        r.style.color = "#4ade80";
        r.innerText = "🎉 太神了！你成功破解了最高難度密碼 4321！獲得 50 分！";
    } else {
        r.style.display = "block";
        r.style.color = "#facc15";
        r.innerText = "❌ 密碼指認失敗！目前為 " + a + "A " + b + "B，請根據提示繼續推理！";
    }
}

// 邀請挑戰按鈕
function shareToFriend() {
    var baseUrl = window.location.href.split('?')[0];
    var shareUrl = baseUrl + "?score=" + currentScore;
    
    var tempInput = document.createElement("input");
    tempInput.value = shareUrl;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand("copy");
    document.body.removeChild(tempInput);
    
    alert("🔗 戰帖複製成功！\n你的朋友點開連結時，會直接看到你挑戰累積的「 " + currentScore + " 分」紀錄！快去挑釁他們，看誰的大腦比較硬核吧！");
}
</script>

</body>
</html>
