<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ 每日 AI 終極推理遊戲盒</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: #1a1a20;
            color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #242430;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #ff9f43;
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            background: #17171e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            border: 1px solid #3d3d4d;
        }
        .score-val { color: #ffca28; font-weight: bold; }
        .day-info {
            text-align: center;
            font-weight: bold;
            color: #00d2d3;
            margin-bottom: 20px;
            background: #2f2f42;
            padding: 10px;
            border-radius: 6px;
        }
        .hint {
            background-color: #38384a;
            padding: 15px;
            border-left: 4px solid #ff9f43;
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .hint.hell { border-left-color: #ff4757; background-color: #3d242b; }
        .soup-text {
            background: #1c1c24;
            padding: 20px;
            border-radius: 8px;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 20px;
            border: 1px dashed #ff4757;
            color: #ffcccc;
        }
        .statements { margin-bottom: 25px; }
        .statement-item {
            background: #2d2d3d;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid #54a0ff;
            font-size: 16px;
        }
        .statement-item strong { color: #54a0ff; }
        .options-title { font-weight: bold; margin-bottom: 10px; color: #a4b0be; }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button.btn-option {
            background-color: #48dbfb;
            color: #1e1e24;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.btn-option:hover { background-color: #0abde3; transform: translateY(-2px); }
        button.btn-option.hell-btn { background-color: #ff6b6b; color: white; }
        button.btn-option.hell-btn:hover { background-color: #ff4757; }
        
        /* 海龜湯問答樣式 */
        .qa-list { margin-bottom: 20px; }
        .qa-item {
            background: #2d2d3d;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .qa-item:hover { background: #38384e; }
        .qa-ans { font-weight: bold; color: #ff9f43; }
        
        .result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding: 20px;
            border-radius: 6px;
            display: none;
            line-height: 1.7;
        }
        .success { background-color: #10ac84; color: white; }
        .fail { background-color: #ee5253; color: white; }
        .soup-reveal { background-color: #2f3542; color: #ffca28; border: 2px solid #ffca28; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .restart-btn {
            flex: 2; background-color: #ff9f43; color: white; border: none;
            padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .reset-score-btn {
            flex: 1; background-color: #57606f; color: white; border: none;
            padding: 14px; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️ 每日 AI 終極推理遊戲盒</h1>
    
    <div class="score-board">
        <div>總挑戰次數: <span id="totalGames" class="score-val">0</span></div>
        <div>最高連勝紀錄: <span id="maxStreak" class="score-val">0</span>🔥</div>
        <div>當前得分: <span id="currentScore" class="score-val">0</span></div>
    </div>

    <div class="day-info" id="dayInfo">正在加載今日主題...</div>
    <div class="hint" id="gameHint">提示載入中...</div>
    
    <!-- 遊戲主要內容區域 -->
    <div id="gameContent"></div>

    <div class="options-title" id="optionsTitle">請進行推理選擇：</div>
    <div class="options-grid" id="optionsContainer"></div>

    <div class="result" id="resultBox"></div>
    
    <div class="action-buttons">
        <button class="restart-btn" onclick="initGame()" style="display:none;" id="restartBtn">換下一題挑戰</button>
        <button class="reset-score-btn" onclick="resetScore()" id="resetBtn">重設分數</button>
    </div>
</div>

<script>
const allSuspects = ["阿明", "小華", "老張", "大雄", "靜香", "胖虎", "小夫"];
const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

// 經典恐怖海龜湯劇本庫（週末輪流隨機出題）
const soupLibrary = [
    {
        title: "不亮的光芒",
        soup: "深夜，小川被急促敲門聲驚醒。透過貓眼往外看，門外空無一人，只有走廊聲控燈一閃一閃。小川鬆了一口氣準備回房，卻突然臉色慘白癱坐在地——因為他意識到，自己已經出不去了。",
        questions: [
            { q: "小川出不去，是因為門被反鎖了嗎？", a: "❌ 不是" },
            { q: "門外的走廊和聲控燈是真實的嗎？", a: "❌ 不是（關鍵！）" },
            { q: "危險其實已經在房間裡面了嗎？", a: "⭕ 是的（驚悚！）" },
            { q: "小川家此時其實停電了對嗎？", a: "⭕ 是的" }
        ],
        truth: "【驚悚真相】殺手早已潛入小川家躲在衣櫃。殺手切斷屋內總電源，並在門外貓眼貼了一張「走廊照片」，用手電筒在後面製造閃爍燈光並敲門。小川準備回房時突然想到：既然家裡因斷電導致魚缸停了，為何貓眼看出去走廊燈還亮著？此時，他身後的衣櫃門緩慢地打開了..."
    },
    {
        title: "消失的盲道",
        soup: "一場大雨過後，小明看著窗外乾淨的街道，突然崩潰痛哭，因為他知道自己再也等不到回家的末班車了。",
        questions: [
            { q: "小明哭是因為公車因為大雨停駛了嗎？", a: "❌ 不是" },
            { q: "小明是用「眼睛」看到窗外的嗎？", a: "❌ 不是（他是盲人！）" },
            { q: "街道變乾淨這件事非常關鍵嗎？", a: "⭕ 是的" },
            { q: "末班車指的是火車或公車嗎？", a: "⭕ 是的" }
        ],
        truth: "【悲傷真相】小明是一名全盲的流浪漢，靠摸索路邊凸出的「盲道磚」前往車站搭車回家。昨晚暴雨引發泥石流沖毀了路面，清潔隊在大雨後將街道清洗得一塵不染，卻也徹底移除了老舊損壞的盲道磚。小明伸手摸不到盲道，知道自己徹底迷路，再也找不到回家的車了。"
    },
    {
        title: "致命的美味",
        soup: "男子在一家餐館點了一碗「海龜湯」，他喝了一口之後，臉色大變，走出餐館後便跳河自盡了。請問為什麼？",
        questions: [
            { q: "這碗海龜湯裡有毒嗎？", a: "❌ 沒有" },
            { q: "男子以前喝過「真正的」海龜湯嗎？", a: "❌ 沒有（這是他第一次喝真的）" },
            { q: "男子自殺與他的過去或家人有關嗎？", a: "⭕ 是的" },
            { q: "他以前吃過某種肉，當時被騙是海龜湯嗎？", a: "⭕ 是的（核心關鍵）" }
        ],
        truth: "【恐怖真相】男子曾和多年好友在荒島求生。當時男子重病瀕死，朋友端來一碗湯說是「海龜湯」救活了他，但朋友隨後卻虛弱死去了。多年後男子在店裡點了真正的海龜湯，發現味道完全不同，他瞬間明白：當年朋友是割下「自己的肉」煮湯救活他。男子崩潰，愧疚自責而投河自盡。"
    },
    {
        title: "床底的視線",
        soup: "小美睡到半夜，覺得口渴，於是伸手到床底下。平時睡在床底下的愛犬立刻過來熱情地舔了舔她的手掌，小美安心地翻身繼續睡。隔天一早，小美在浴室發現了愛犬的屍體，和牆上血淋淋的字，當場嚇瘋。",
        questions: [
            { q: "浴室牆上的字是愛犬寫的嗎？", a: "❌ 不是（狗怎麼會寫字！）" },
            { q: "昨晚舔小美手的「生物」是她的愛犬嗎？", a: "❌ 不是（驚悚關鍵！）" },
            { q: "小美的房間裡有躲潛入的外人嗎？", a: "⭕ 是的" }
        ],
        truth: "【變態真相】昨晚潛入家中的變態殺手，在半夜就已經把愛犬殺害並拖入浴室。殺手隨後自己躲在小美的床底下。當小美半夜伸手下去時，舔她手的其實是躲在黑暗中的殺手舌頭。浴室牆上留下的血字寫著：『不是只有狗才會舔手喔。』"
    },
    {
        title: "電梯的重力",
        soup: "大樓停電，小剛只好走樓梯爬上 15 樓。回到家後他發現妻子慘死在客廳。就在他準備報警時，突然聽到大樓電力恢復、電梯啟動並在 15 樓停下的聲音。小剛一聽，臉色發白，因為他知道自己死定了。",
        questions: [
            { q: "小剛害怕是因為電梯裡有凶手嗎？", a: "❌ 不是" },
            { q: "小剛自己就是凶手嗎？", a: "❌ 不是" },
            { q: "小剛爬樓梯的時候，凶手其實在電梯裡嗎？", a: "⭕ 是的（重力關鍵！）" }
        ],
        truth: "【絕望真相】凶手殺完人後原本要搭電梯逃跑，卻突然遇到大樓停電，導致凶手被困在電梯車廂內。小剛是在停電後才開始爬樓梯的，當他爬到 15 樓時，電力剛好恢復，原本卡在底層或中途的電梯立刻回到 15 樓（因為有人在 15 樓按了電梯，或者電梯系統復歸）。電梯門一開，出來的就會是那個被放出來的凶手，而此時小剛無處可逃。"
    },
    {
        title: "冰冷的母親",
        soup: "冬天的早晨，小女孩醒來發現媽媽躺在身邊一動不動，身體無比冰冷。小女孩沒有哭，反而高興地幫媽媽蓋好被子，並出門上學了。等到晚上鄰居發現時，媽媽已經死去了，但小女孩卻被控有重大嫌疑。為什麼？",
        questions: [
            { q: "小女孩怨恨媽媽所以故意殺她嗎？", a: "❌ 不是（小女孩很愛媽媽）" },
            { q: "媽媽是在小女孩幫她蓋被子之前就死了嗎？", a: "❌ 不是（蓋被子時還活著）" },
            { q: "小女孩「蓋被子」這個舉動導致了媽媽的死亡嗎？", a: "⭕ 是的（致命誤解！）" }
        ],
        truth: "【無知真相】前天晚上天氣極其寒冷，媽媽開著一盆炭火在房間取暖。半夜一氧化碳中毒，媽媽陷入深度昏迷，體溫下降。隔天清晨小女孩醒來，以為媽媽只是太冷發抖、身體冰冷，為了讓媽媽「暖和」，體貼的小女孩把窗戶反鎖死，並把厚重的棉被連頭帶腳死死蓋住媽媽，隨後出門。昏迷的媽媽因最後的氧氣被斷絕，窒息死亡。無知的愛成了致命的凶器。"
    },
    {
        title: "拍照的乘客",
        soup: "在一輛深夜行駛的末班捷運上，車廂裡除了小玲只有一對母女。小玲拿出手機自拍，拍完看了一眼照片，突然大聲慘叫，並在下一站頭也不回地衝出車廂。那對母女全程只是冷冷地看著她。",
        questions: [
            { q: "照片裡拍到了鬼魂或超自然現象嗎？", a: "❌ 沒有" },
            { q: "那對母女是活人嗎？", a: "❌ 不是（女孩不是，媽媽是）" },
            { q: "小玲是因為在照片鏡面反射中看到了恐怖的真相嗎？", a: "⭕ 是的" }
        ],
        truth: "【驚悚真相】捷運車廂的玻璃拍照時會有反射。小玲透過自拍照片的放大鏡面，驚恐地發現：坐在對面的小女孩雙腳離地、臉色鐵青，而坐在旁邊的媽媽，正用一根細細的尼龍繩勒住小女孩的脖子、從背後架著她的身體。這根本不是媽媽帶女兒，而是一個殺人犯正夾帶著一具剛死不久的屍體在搭車！"
    }
];

let currentGameType = ""; // "truth", "thief", "soup"
let gameData = { answerTarget: "", soupIndex: 0 };
let hasAnswered = false;

let score = parseInt(localStorage.getItem('box_score')) || 0;
let totalGames = parseInt(localStorage.getItem('box_total')) || 0;
let maxStreak = parseInt(localStorage.getItem('box_streak')) || 0;
let currentStreak = parseInt(localStorage.getItem('box_current_streak')) || 0;

function updateScoreBoard() {
    document.getElementById("currentScore").innerText = score;
    document.getElementById("totalGames").innerText = totalGames;
    document.getElementById("maxStreak").innerText = maxStreak;
}

function resetScore() {
    if(confirm("確定要重設所有數據嗎？")) {
        score = 0; totalGames = 0; maxStreak = 0; currentStreak = 0;
        localStorage.clear();
        updateScoreBoard();
        initGame();
    }
}

function initGame() {
    updateScoreBoard();
    hasAnswered = false;
    const d = new Date();
    const dayOfWeek = d.getDay(); 
    
    let htmlContent = "";
    let htmlOptions = "";
    let count = 5;

    // 1. 根據星期決定遊戲型態
    if (dayOfWeek === 1 || dayOfWeek === 2) {
        currentGameType = "truth"; // 找真話
        count = (dayOfWeek === 1) ? 3 : 4;
    } else if (dayOfWeek >= 3 && dayOfWeek <= 5) {
        currentGameType = "thief"; // 抓小偷
        count = (dayOfWeek === 3) ? 4 : 5;
    } else {
        currentGameType = "soup";  // 週末海龜湯地獄
    }

    // 2. 渲染邏輯
    if (currentGameType === "truth") {
        document.getElementById("dayInfo").innerText = `📅 今天是：${weekDays[dayOfWeek]}（形態：⭐ 誰說真話）`;
        document.getElementById("gameHint").innerText = `💡 提示：這裡有 ${count} 個人，其中【只有 1 個人】說了真話，其餘都在撒謊。請用邏輯找出誠實的人！`;
        document.getElementById("optionsTitle").innerText = "請選擇誰說了【真話】：";

        let shuffled = [...allSuspects].sort(() => 0.5 - Math.random());
        let currentSuspects = shuffled.slice(0, count);
        let honestPerson = currentSuspects[Math.floor(Math.random() * count)];
        gameData.answerTarget = honestPerson;

        currentSuspects.forEach(name => {
            let isHonest = (name === honestPerson);
            let others = currentSuspects.filter(s => s !== name);
            let target = others[Math.floor(Math.random() * others.length)];
            let targetIsHonest = (target === honestPerson);
            let speech = isHonest ? (targetIsHonest ? `「${target} 說的是真話。」` : `「${target} 在撒謊！」`) : (targetIsHonest ? `「${target} 絕對在撒謊！」` : `「我相信 ${target}，他/她說真話。」`);
            
            htmlContent += `<div class="statement-item">👤 <strong>${name}</strong> 說：${speech}</div>`;
