<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🕵️ 每日推理遊戲盒</title>
    <style>
        body { background-color: #1a1a20; color: #f5f5f7; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { background-color: #242430; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn { background-color: #ff9f43; color: #1a1a20; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 5px; font-size: 16px; }
        .btn:hover { background-color: #ffb366; }
        .rescue-btn { background-color: #ee5253; color: white; padding: 8px 15px; font-size: 13px; }
        .q-item { background: #2d2d3d; padding: 10px; margin: 10px 0; border-radius: 6px; cursor: pointer; border-left: 4px solid #48dbfb; text-align: left; }
        .ans-text { float: right; color: #ff9f43; font-weight: bold; }
        .txt { font-size: 18px; line-height: 1.6; background: #1c1c24; padding: 15px; border-radius: 6px; border: 1px dashed #ff4757; margin-bottom: 20px; text-align: left; }
    </style>
</head>
<body>

    <!-- 💥 萬能強制救援按鈕：如果畫面卡住，點這個絕對能開！ -->
    <button class="btn rescue-btn" onclick="forceLoadSoup()">點此手動強制載入遊戲 (若畫面卡住請點我)</button>

    <div class="box">
        <h1>🕵️ 每日推理遊戲盒</h1>
        <h3 id="dayText">載入中...</h3>
        <p id="hintText">請稍候...</p>
        
        <div id="mainContent">
            <!-- 這裡會顯示海龜湯或邏輯題 -->
        </div>

        <h4 id="actionTitle">請點擊下方查看線索：</h4>
        <div id="btnArea">
            <!-- 這裡會顯示選項按鈕 -->
        </div>

        <div id="resultText" style="margin-top:20px; padding:15px; border-radius:6px; font-weight:bold; background:#38384a; display:none;"></div>
    </div>

<script>
// 核心簡易劇本庫
var soupItem = {
    title: "不亮的光芒",
    soup: "深夜，小川被急促敲門聲驚醒。透過貓眼往外看，門外空無一人，只有走廊聲控燈一閃一閃。小川鬆了一口氣準備回房，卻突然臉色慘白癱坐在地——因為他意識到，自己已經出不去了。",
    questions: [
        { q: "小川出不去，是因為門被反鎖了嗎？", a: "❌ 不是" },
        { q: "門外的走廊和聲控燈是真實的嗎？", a: "❌ 不是（關鍵！）" },
        { q: "危險其實已經在房間裡面了嗎？", a: "⭕ 是的（驚悚！）" },
        { q: "小川家此時其實停電了對嗎？", a: "⭕ 是的" }
    ],
    truth: "【驚悚真相】殺手早已潛入小川家躲在衣櫃。殺手切斷屋內總電源，並在門外貓眼貼了一張「走廊照片」，用手電筒在後面製造閃爍燈光並敲門。小川準備回房時突然想到：既然家裡因斷電導致魚缸停了，為何貓眼看出去走廊燈還亮著？此時，他身後的衣櫃門緩慢地打開了..."
};

function startNormalGame() {
    document.getElementById("dayText").innerText = "📅 今日任務：⭐ 找出誰在說真話";
    document.getElementById("hintText").innerText = "提示：這三個人之中，只有一個人說的是真話，其餘兩人都說謊！";
    
    var html = '<div class="txt">' +
               '👤 <strong>阿明</strong> 說：「小華在撒謊！」<br><br>' +
               '👤 <strong>小華</strong> 說：「老張說的是真話。」<br><br>' +
               '👤 <strong>老張</strong> 說：「阿明和大雄都在撒謊！」' +
               '</div>';
    document.getElementById("mainContent").innerHTML = html;
    document.getElementById("actionTitle").innerText = "請指認誰說了【真話】：";
    
    var btns = '<button class="btn" onclick="showAns(false)">阿明</button>' +
               '<button class="btn" onclick="showAns(true)">小華</button>' +
               '<button class="btn" onclick="showAns(false)">老張</button>';
    document.getElementById("btnArea").innerHTML = btns;
}

function forceLoadSoup() {
    document.getElementById("dayText").innerText = "📅 週末限定：👿 驚悚海龜湯地獄";
    document.getElementById("hintText").innerText = "提示：請點擊下方的「關鍵提問」獲取線索，推理出全貌後點擊指認真相通關！";
    
    var html = '<div class="txt"><strong>【湯麵】</strong><br>' + soupItem.soup + '</div>';
    for (var i = 0; i < soupItem.questions.length; i++) {
        html += '<div class="q-item" onclick="document.getElementById(\'ans-\'+' + i + ').style.display=\'inline\'">' +
                '❓ ' + soupItem.questions[i].q + 
                '<span class="ans-text" id="ans-' + i + '" style="display:none;"> ' + soupItem.questions[i].a + '</span>' +
                '</div>';
    }
    document.getElementById("mainContent").innerHTML = html;
    document.getElementById("actionTitle").innerText = "當你理清邏輯後：";
    document.getElementById("btnArea").innerHTML = '<button class="btn" style="background:#ff6b6b; color:white; width:100%;" onclick="showSoupTruth()">🚨 我已推理完成，指認真相！</button>';
}

function showAns(isCorrect) {
    var r = document.getElementById("resultText");
    r.style.display = "block";
    if(isCorrect) {
        r.innerHTML = "🎉 答對了！你太厲害了！";
        r.style.background = "#10ac84";
    } else {
        r.innerHTML = "❌ 答錯了！他的邏輯不對，再想想看。";
        r.style.background = "#ee5253";
    }
}

function showSoupTruth() {
    var r = document.getElementById("resultText");
    r.style.display = "block";
    r.style.background = "#2f3542";
    r.style.color = "#ffca28";
    r.innerHTML = "🎉 <strong>挑戰成功！真相大白！</strong><br><br>" + soupItem.truth;
}

// 自動根據星期幾載入
var day = new Date().getDay();
if (day === 0 || day === 6) {
    forceLoadSoup(); // 週六日直接啟動海龜湯
} else {
    startNormalGame(); // 平日啟動邏輯題
}
</script>
</body>
</html>
